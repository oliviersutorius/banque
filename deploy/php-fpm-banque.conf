; Pool PHP-FPM dédié à Mes Comptes (à adapter). Copier dans /etc/php/8.5/fpm/pool.d/banque.conf,
; puis : sudo systemctl reload php8.5-fpm
;
; L'utilisateur « banque » possède /srv/banque/data et /etc/banque/cle ; personne d'autre ne peut les lire.

[banque]
user = banque
group = banque

listen = /run/php/php8.5-fpm-banque.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Variables de l'application (voir docs/TECHNIQUE.md, « Variables d'environnement »).
; BANQUE_TOTP n'est PAS défini : la double authentification est toujours exigée en ligne.
clear_env = yes
env[BANQUE_HOTES] = comptes.example.fr
env[BANQUE_CLE_FICHIER] = /etc/banque/cle

; Erreurs : jamais affichées, journalisées à part
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/banque-errors.log

; Confinement : fichiers du projet, clé, dossier temporaire des envois
php_admin_value[open_basedir] = /srv/banque/:/etc/banque/cle:/tmp/:/var/log/php-fpm/banque-errors.log
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
php_admin_flag[allow_url_fopen] = off

; Taille des envois : CSV de 2 Mo, corps JSON de 10 Mo (limites de l'API)
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 11M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
